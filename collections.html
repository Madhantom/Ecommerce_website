{% extends "shop/layouts/main.html" %} {% block content %}
{% load static %}
<section class="collection-section">
  <div class="container ">
    <div class="text-center mb-5 mt-4">
      <h2 class="section-title">Best Collections</h2>
      <p class="section-subtitle">Explore our most popular categories</p>
    </div>
    <div class="row">
      {% for item in category %}
      <div class="col-lg-3 col-md-4 col-sm-6 mb-4">
        <div class="collection-card">
          <div class="collection-img">
            <img src="{{ item.image.url }}" alt="{{ item.name }}" />
          </div>
          <div class="collection-body">
            <h5>{{ item.name }}</h5>
            <p>{{ item.descripton }}</p>
            <a href="{% url 'collections' item.name %}" class="collection-btn">
              Explore
            </a> 
          </div>
        </div>
      </div>
      {% endfor %} 
    </div>
  </div>
</section>
{% endblock content %}
