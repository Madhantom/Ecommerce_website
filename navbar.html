<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
  <div class="container ">
    <a class="navbar-brand" href="{% url 'home' %}"><i class="fa-solid fa-cart-plus" style="color: rgb(255, 255, 255);"></i>ShopKart</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav ">
      <div class="navbar-nav ms-auto">
          <a class="nav-link " id="homee" aria-current="page" href="{% url 'home' %}"><i class="fa-solid fa-house" style="color: rgb(255, 255, 255);"></i>Home</a>
           <a class="nav-link" href="{% url 'Collections' %}"><i class="fa-solid fa-cube" style="color: rgb(255, 255, 255);"></i>Collections</a>
           <a class="nav-link" href="{% url 'cart' %}"><i class="fa-solid fa-cart-arrow-down" style="color: rgb(255, 255, 255);"></i>Cart</a>
           <a class="nav-link" href="{% url 'favviewpage' %}"><i class="fa-solid fa-heart" style="color: rgb(248, 248, 248);"></i>Fav</a>

          {% if request.user.is_authenticated %}
           <a class="nav-link"  aria-current="page" href=""><i class="fa-solid fa-user" style="color: rgb(248, 248, 248);"></i>{{request.user}}</a>
           <a class="nav-link" aria-current="page" href="{% url 'logout' %}"><i class="fa-solid fa-arrow-right-from-bracket" style="color: rgb(248, 248, 248);"></i>Logout</a>
          {% else %}
           <a class="nav-link" href="{% url 'login' %}"><i class="fa-solid fa-arrow-right-to-bracket" style="color: rgb(248, 248, 248);"></i>Login</a>
           <a class="nav-link" href="{% url 'register' %}"><i class="fa-solid fa-user" style="color: rgb(255, 255, 255);"></i>Register</a>
          {% endif %}
          
      </div>
    </div>
  </div>
